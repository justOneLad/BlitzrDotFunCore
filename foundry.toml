[profile.default]
src = "."
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.32"
optimizer = true
optimizer_runs = 200
via_ir = true
# src = "." makes forge treat every .sol file under the repo root as an independent compile
# target — lib/openzeppelin-contracts-upgradeable/{test,lib/{erc4626-tests,forge-std,
# halmos-cheatcodes}} and the same two subpaths one level down (its own nested
# openzeppelin-contracts dependency) must be excluded, since BlitzrSwapRouter imports real source
# from both openzeppelin-contracts-upgradeable/contracts/ and its nested
# lib/openzeppelin-contracts/contracts/ (several upgradeable contracts still pull stateless utils
# from the base package) — those must stay reachable. Only each package's own dev-only test suite
# and test-only dependencies are excluded here.
skip = [
    "lib/openzeppelin-contracts-upgradeable/test/**",
    "lib/openzeppelin-contracts-upgradeable/fv/**",
    "lib/openzeppelin-contracts-upgradeable/lib/erc4626-tests/**",
    "lib/openzeppelin-contracts-upgradeable/lib/forge-std/**",
    "lib/openzeppelin-contracts-upgradeable/lib/halmos-cheatcodes/**",
    "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/test/**",
    "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/fv/**",
    "lib/openzeppelin-contracts-upgradeable/lib/openzeppelin-contracts/lib/**",
]

[fmt]
line_length = 100
tab_width = 4
